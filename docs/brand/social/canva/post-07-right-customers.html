<!doctype html><html><head><meta charset="utf-8">
<title>Growthforge 07 · Your brand in front of the right customers</title>

<style>/* ------------------------------------------------------------------
   Growthforge social kit (v2, minimal) — shared styles for every post.
   Canvas 1080 x 1350 (4:5 portrait). Light "ribbon" direction after the
   Kameleon Behance kit: one photo, one ribbon, a short headline, one
   line, one button. .dark posts reuse the website's #0b0b0f.
   The previous, busier set lives in v1/.
   ------------------------------------------------------------------ */


*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:#fffaf5}

.post{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:"Inter",system-ui,sans-serif;color:#1d120b;background:#fffaf5}
.post.dark{color:#f5f5f7;background:#0b0b0f}
.abs{position:absolute}

/* Type */
.disp{font-family:"Space Grotesk",sans-serif;font-weight:700;letter-spacing:-0.055em;line-height:0.96}
.deep{color:#bf4a11}
.dark .deep{color:#ffa23a}
.grad{color:#ff6b2c}
.sub{font-family:"Space Grotesk",sans-serif;font-weight:500;letter-spacing:-0.025em;line-height:1.25;color:#6b5a4f}
.dark .sub{color:#c9c9cf}
.center{text-align:center}

/* Ribbon: every post draws its own path, these give it the look */
.ribbon{position:absolute;inset:0;width:1080px;height:1350px;overflow:visible}
.r-pale{fill:none;stroke:#ffe6d3;stroke-width:230;stroke-linecap:round}
.r-main{fill:none;stroke:url(#rg);stroke-width:120;stroke-linecap:round}
.dark .r-pale{stroke:rgba(255,107,44,0.16)}

/* Logo: mark + wordmark, top-left */
.brand{position:absolute;left:84px;top:80px;display:flex;align-items:center;gap:14px;z-index:5}
.brand img{width:52px;height:52px;object-fit:contain}
.brand span{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:28px;letter-spacing:-0.04em}

/* Photos */
.photo{position:absolute;overflow:hidden;background-size:cover;background-position:center;background-color:#ffd9bf}
.photo.round{border-radius:50%}
.photo.soft{border-radius:56px}
.photo.arch{border-radius:999px 999px 56px 56px}
.edge{box-shadow:0 0 0 10px #fffaf5}

/* Button */
.go{position:absolute;background:linear-gradient(90deg,#ff6b2c,#ff9a2e);color:#fff;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:24px;letter-spacing:-0.02em;border-radius:999px;padding:20px 34px;display:inline-flex;align-items:center;gap:12px;box-shadow:0 18px 36px -14px rgba(255,107,44,0.7);z-index:5}
.go svg{width:22px;height:22px}

/* Round arrow badge */
.dot{border-radius:50%;background:linear-gradient(140deg,#ff6b2c,#ffa23a);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 10px 24px rgba(255,107,44,0.40)}
.ring-badge{width:132px;height:132px;border-radius:50%;background:#ffe9da;display:flex;align-items:center;justify-content:center;flex:none}
.ring-badge .dot{width:76px;height:76px}
.dark .ring-badge{background:rgba(255,255,255,0.08)}

/* Small floating note (one per post at most) */
.note{position:absolute;background:#fff;border-radius:22px;padding:16px 20px;display:flex;align-items:center;gap:12px;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:20px;letter-spacing:-0.02em;color:#1d120b;box-shadow:0 22px 44px -16px rgba(90,30,0,0.45);z-index:5}
.note .dot{width:36px;height:36px;box-shadow:none}
.note .dot svg{width:18px;height:18px}

img.photo{display:block;object-fit:cover}
</style></head><body><div data-document-role="page" data-label="Your brand in front of the right customers" class="post">
  <svg class="ribbon" viewBox="0 0 1080 1350">
    <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa23a"/><stop offset=".55" stop-color="#ff7a2e"/><stop offset="1" stop-color="#ff6b2c"/></linearGradient></defs>
    <path class="r-pale" d="M1240 330 C1010 40 640 110 720 430 C780 660 1140 640 1100 900 C1065 1150 760 1190 520 1250 C280 1310 80 1230 -140 1340"/>
    <path class="r-main" d="M1240 330 C1010 40 640 110 720 430 C780 660 1140 640 1100 900 C1065 1150 760 1190 520 1250 C280 1310 80 1230 -140 1340"/>
  </svg>
  <div class="brand"><img src="../../logo/colour/mark-g-original.png" alt=""><span>Growthforge</span></div>

  <h1 class="disp abs" style="left:84px;top:290px;font-size:104px;width:520px">Your brand<br>in front of<br><span class="deep">the right</span><br><span class="grad">customers.</span></h1>
  <div class="abs" style="left:84px;top:790px;display:flex;align-items:center;gap:32px;width:500px">
    <div class="ring-badge"><div class="dot"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10"/><path d="M17 8v9H8"/></svg></div></div>
    <p class="sub" style="font-size:31px">Ads, content and automations that drive sales.</p>
  </div>

</div></body></html>
